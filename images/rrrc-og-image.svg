<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#212121;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0074e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0090ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#0074e0" opacity="0.08"/>
  <circle cx="1100" cy="530" r="180" fill="#0074e0" opacity="0.08"/>
  
  <!-- Subtle grid pattern -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#0074e0" stroke-width="1" opacity="0.15"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#0074e0" stroke-width="1" opacity="0.15"/>
  
  <!-- Main initials -->
  <text x="600" y="365" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="200" font-weight="800" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)">
    RRRC
  </text>
  
  <!-- Accent line -->
  <rect x="400" y="400" width="400" height="4" fill="#0074e0" opacity="0.8" rx="2"/>
</svg>